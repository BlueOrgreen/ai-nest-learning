server {
    listen 80;
    server_name www.admin.chenchar.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name www.admin.chenchar.com;

    ssl_certificate /etc/nginx/ssl/www.admin.chenchar.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/www.admin.chenchar.com.key;

    # Docker 内置 DNS。使用变量形式的 proxy_pass 才会按 TTL 重新解析上游容器 IP。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web_nest_upstream web-nest:3000;

    location / {
        proxy_pass http://$web_nest_upstream;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
