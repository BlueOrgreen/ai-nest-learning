services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - gateway
      - web-nest
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次空数据卷时执行 00-*.sql 与 01-import-seeds.sh；已有 volume 请用 pnpm db:init
      - ./mysql:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    environment:
      - JWT_SECRET=${JWT_SECRET:-my-firstnest-secret-2026}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://www.admin.chenchar.com,http://localhost:3000}
      - USER_SERVICE_URL=${USER_SERVICE_URL:-http://user-service:3001}
      - ORDER_SERVICE_URL=${ORDER_SERVICE_URL:-http://order-service:3002}
    depends_on:
      - user-service
      - order-service
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
      # 默认与本地 apps/user-service/.env 保持一致
      - DB_DATABASE=${USER_DB_DATABASE:-nest_user_service}
      - DB_SYNCHRONIZE=${DB_SYNCHRONIZE:-true}
    depends_on:
      - mysql
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
      # 默认与本地 apps/order-service/.env 保持一致
      - DB_DATABASE=${ORDER_DB_DATABASE:-nest_order_service}
      - DB_SYNCHRONIZE=${DB_SYNCHRONIZE:-true}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USER_SERVICE_URL=http://user-service:3001
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  web-nest:
    build:
      context: ${WEB_NEST_PATH:-../web-nest}
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://api.chenchar.com
        NEXT_PUBLIC_ORDER_API_BASE_URL: https://api.chenchar.com
        NEXT_PUBLIC_ORDER_SERVICE_BASE_URL: https://api.chenchar.com
        NEXT_PUBLIC_USER_API_BASE_URL: https://api.chenchar.com
    environment:
      # Docker 可能覆盖 HOSTNAME；必须 0.0.0.0，否则 Nginx 反代会 502
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-my-firstnest-secret-2026}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  mysql_data:
