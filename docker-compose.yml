version: '3.8'

services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - gateway
      - web-nest
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://www.admin.chenchar.com,http://localhost:3000}
      - USER_SERVICE_URL=${USER_SERVICE_URL:-http://user-service:3001}
      - ORDER_SERVICE_URL=${ORDER_SERVICE_URL:-http://order-service:3002}
    depends_on:
      - mysql
      - user-service
      - order-service
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
    depends_on:
      - mysql
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
    depends_on:
      - mysql
    restart: unless-stopped

  web-nest:
    build:
      context: ${WEB_NEST_PATH:-../web-nest}
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://api.chenchar.com
        NEXT_PUBLIC_ORDER_API_BASE_URL: https://api.chenchar.com
        NEXT_PUBLIC_ORDER_SERVICE_BASE_URL: https://api.chenchar.com
        NEXT_PUBLIC_USER_API_BASE_URL: https://api.chenchar.com
    environment:
      - JWT_SECRET=${JWT_SECRET:-my-firstnest-secret-2026}
    expose:
      - "3000"
    restart: unless-stopped

volumes:
  mysql_data:
